<div id="product">
  <img src="{{ product?.image }}" width="50%" style="margin-top: 10px" class="productImg" />
  <h3>{{ product?.name }}</h3>
  <p style="font-size: 80%; text-align: center">{{ product?.description }}</p>
  <p style="color: gold; font-size: 120%">{{ product?.rating }}</p>
  <p>Cena: {{ product?.price }} zł</p>
  <button id="addBtn" (click)="onAddToCart()">Dodaj do koszyka</button>
</div>
