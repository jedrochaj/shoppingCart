<head>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
  />
</head>
<div id="cart">
  <h2>Koszyk</h2>

  @if (app.cartItems.length === 0) {
    <p>Koszyk jest pusty</p>
  } @else {
    @for (item of app.cartItems; track item.id; let i = $index) {
      <div>
        <span>{{ item.name }} - {{ item.price }} zł</span>

        <div>
          <button id="removeBtn" (click)="app.decreaseQuantity(i)">-</button>
          <span>{{ item.quantity }}</span>
          <button id="removeBtn" (click)="app.increaseQuantity(i)">+</button>
          <button id="removeBtn" (click)="app.handleRemoveFromCart(i)">
            Usuń <i class="fa fa-trash-o" style="font-weight: bold"></i>
          </button>
        </div>
      </div>
    }

    <p>Razem: {{ getTotal() }} zł</p>
    <button id="addBtn" routerLink="/checkout">Przejdź do płatności</button>
  }
</div>
