<div style="padding: 20px">
  <button routerLink="/products" id="addBtn" style="margin-bottom: 20px">
    Powrót do produktów
  </button>

  @if (product) {
    <div id="product" style="max-width: 400px; margin: 0 auto; text-align: center">
      <img [src]="product.image" width="70%" style="margin-top: 10px" class="productImg" />
      <h2>{{ product.name }}</h2>
      <p style="font-size: 90%; text-align: center">{{ product.description }}</p>
      <p style="color: gold; font-size: 120%">{{ product.rating }}</p>
      <p style="font-size: 120%; font-weight: bold">Cena: {{ product.price }} zł</p>

      <button id="addBtn" (click)="app.handleAddToCart(product)" style="margin-top: 10px">
        Dodaj do koszyka
      </button>
    </div>
  } @else {
    <p style="text-align: center">Nie znaleziono produktu.</p>
  }
</div>
