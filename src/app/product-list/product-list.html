<h1 style="margin-left: 10px">Wszystkie produkty</h1>

<swiper-container slides-per-view="4" speed="100" loop="true" navigation="true">
  @for (product of app.products; track product.id) {
    <swiper-slide>
      <app-product-item
        [product]="product"
        (addToCart)="app.handleAddToCart($event)"
      ></app-product-item>
    </swiper-slide>
  }
</swiper-container>
